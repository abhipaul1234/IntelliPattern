{% set current_path = request.path %}
<nav id="mainNav" class="site-nav sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between px-4 sm:px-8 py-3">
        <a href="/" class="flex items-center gap-3">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="IntelliPattern Logo" class="w-9 h-9 rounded-lg">
            <span class="font-display text-xl font-bold gradient-text tracking-tight">IntelliPattern</span>
        </a>

        <button id="navToggle" type="button" class="md:hidden w-10 h-10 rounded-lg border border-white/15 text-gray-200 hover:bg-white/5 transition" aria-label="Toggle menu" aria-expanded="false" aria-controls="navMenu">
            <i class="fas fa-bars"></i>
        </button>

        <div id="navMenu" class="hidden md:flex absolute md:static top-full left-0 right-0 flex-col md:flex-row md:items-center gap-1 md:gap-7 px-4 sm:px-8 md:px-0 py-4 md:py-0 bg-[#0b0b0c]/95 md:bg-transparent border-b border-white/10 md:border-0">
            <a href="/" class="nav-link py-2 md:py-0 {{ 'active' if current_path == '/' }}">Home</a>
            {% if current_user.is_authenticated %}
                <a href="/dashboard" class="nav-link py-2 md:py-0 {{ 'active' if current_path == '/dashboard' }}">Dashboard</a>
                <a href="/patterns" class="nav-link py-2 md:py-0 {{ 'active' if current_path == '/patterns' }}">Patterns</a>
                <a href="/ai-insights" class="nav-link py-2 md:py-0 {{ 'active' if current_path == '/ai-insights' }}">AI Insights</a>
                <span class="text-gray-400 text-sm py-2 md:py-0 truncate max-w-[16rem]">{{ current_user.email }}</span>
                <a href="/logout" class="inline-flex items-center justify-center gap-2 border border-white/20 hover:bg-white/10 px-4 py-2 rounded-lg text-sm font-medium transition-colors"><i class="fas fa-arrow-right-from-bracket text-xs"></i>Logout</a>
            {% else %}
                <a href="/login" class="nav-link py-2 md:py-0 {{ 'active' if current_path == '/login' }}">Login</a>
                <a href="/register" class="inline-flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>
<script>
    (function () {
        var nav = document.getElementById('mainNav');
        var toggle = document.getElementById('navToggle');
        var menu = document.getElementById('navMenu');
        function onScroll() { nav.classList.toggle('is-scrolled', window.scrollY > 10); }
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        toggle.addEventListener('click', function () {
            var open = menu.classList.toggle('hidden') === false;
            menu.classList.toggle('flex', open);
            toggle.setAttribute('aria-expanded', String(open));
            toggle.innerHTML = open ? '<i class="fas fa-xmark"></i>' : '<i class="fas fa-bars"></i>';
        });
    })();
</script>
